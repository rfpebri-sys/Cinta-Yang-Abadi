<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💘 LOVE APOCALYPSE • Hujan + Kembang Api</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body {
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: white;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 30px rgba(255, 50, 100, 0.8);
    }
    h1 {
      font-size: 4rem;
      background: linear-gradient(45deg, #ff6b9d, #ff2e7d, #ff6b9d);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradasi 3s ease infinite;
      letter-spacing: 5px;
    }
    @keyframes gradasi {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    p {
      font-size: 1.3rem;
      opacity: 0.8;
      margin-top: -5px;
      color: #ffb3c6;
    }
    .btn-group {
      pointer-events: auto;
      margin-top: 25px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 28px;
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 50, 100, 0.2);
      letter-spacing: 1px;
    }
    .btn:hover {
      background: rgba(255, 50, 100, 0.4);
      transform: scale(1.07);
      box-shadow: 0 0 40px rgba(255, 50, 100, 0.5);
    }
    .btn-musik {
      background: rgba(100, 50, 255, 0.2);
      border-color: rgba(100, 50, 255, 0.3);
    }
    .btn-musik:hover {
      background: rgba(100, 50, 255, 0.5);
    }
    .btn-ledak {
      background: rgba(255, 200, 0, 0.2);
      border-color: rgba(255, 200, 0, 0.3);
      animation: blink 1s infinite;
    }
    .btn-ledak:hover {
      background: rgba(255, 200, 0, 0.5);
    }
    .btn-hujan {
      background: rgba(0, 200, 255, 0.2);
      border-color: rgba(0, 200, 255, 0.3);
    }
    .btn-hujan:hover {
      background: rgba(0, 200, 255, 0.5);
    }
    @keyframes blink {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 200, 0, 0.2); }
      50% { box-shadow: 0 0 60px rgba(255, 200, 0, 0.8); }
    }
    #info {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      opacity: 0.4;
      z-index: 10;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      h1 { font-size: 2.5rem; }
      .btn { padding: 10px 18px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>💘 LOVE APOCALYPSE</h1>
  <p>～ cinta turun dari langit～</p>
  <div class="btn-group">
    <button class="btn" onclick="gantiWarna('merah')">❤️ Merah</button>
    <button class="btn" onclick="gantiWarna('biru')">💙 Biru</button>
    <button class="btn" onclick="gantiWarna('hijau')">💚 Hijau</button>
    <button class="btn btn-musik" onclick="gantiLagu('sedih')">🎵 Sedih</button>
    <button class="btn btn-musik" onclick="gantiLagu('ceria')">🎵 Ceria</button>
    <button class="btn btn-musik" onclick="gantiLagu('random')">🎲 Random</button>
    <button class="btn btn-ledak" onclick="loveExplosion()">💥 Ledakan</button>
    <button class="btn btn-hujan" onclick="toggleHujanLove()">🌧️ Hujan Love</button>
    <button class="btn btn-ledak" onclick="fireworks()">🎆 Kembang Api</button>
  </div>
</div>
<div id="info">✨ GeminiXD • 2108 • Tanpa Filter • Full Partikel + Hujan + Fireworks</div>

<script>
  // ========== 3D SETUP ==========
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.5, 7);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Lampu
  const ambient = new THREE.AmbientLight(0x404060, 0.5);
  scene.add(ambient);
  const light1 = new THREE.PointLight(0xff4d6d, 1.2, 20);
  light1.position.set(4, 5, 6);
  scene.add(light1);
  const light2 = new THREE.PointLight(0x4d6dff, 0.8, 20);
  light2.position.set(-4, 3, 5);
  scene.add(light2);
  const light3 = new THREE.DirectionalLight(0xffffff, 0.3);
  light3.position.set(0, 5, 0);
  scene.add(light3);

  // ========== HATI 3D ==========
  const heartGroup = new THREE.Group();
  const matHati = new THREE.MeshStandardMaterial({
    color: 0xff2e7d,
    emissive: 0x550011,
    roughness: 0.2,
    metalness: 0.1,
    emissiveIntensity: 0.3
  });

  const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), matHati);
  s1.position.set(-1.0, 0.8, 0);
  heartGroup.add(s1);
  const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), matHati);
  s2.position.set(1.0, 0.8, 0);
  heartGroup.add(s2);
  const s3 = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), matHati);
  s3.position.set(0, -0.7, 0);
  heartGroup.add(s3);

  const glowMat = new THREE.MeshStandardMaterial({
    color: 0xff6b9d,
    emissive: 0xff2e7d,
    transparent: true,
    opacity: 0.2
  });
  const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), glowMat);
  glowSphere.position.set(0, 0.2, 0.5);
  heartGroup.add(glowSphere);

  scene.add(heartGroup);

  // ========== BINTANG ==========
  const starCount = 1000;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  const starColor = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 60;
    starPos[i*3+1] = (Math.random() - 0.5) * 40;
    starPos[i*3+2] = (Math.random() - 0.5) * 30;
    const c = new THREE.Color().setHSL(0.95 + Math.random()*0.1, 0.8, 0.5 + Math.random()*0.3);
    starColor[i*3] = c.r;
    starColor[i*3+1] = c.g;
    starColor[i*3+2] = c.b;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColor, 3));
  const starMat = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // ========== PARTIKEL LOVE (LEDAKAN) ==========
  let loveParticles = [];

  function createLoveExplosion() {
    loveParticles.forEach(p => scene.remove(p));
    loveParticles = [];

    const count = 300;
    const colors = [0xff2e7d, 0xff6b9d, 0xff1493, 0xff69b4, 0xff4d6d];
    
    for (let i = 0; i < count; i++) {
      const size = 0.05 + Math.random() * 0.15;
      const geo = new THREE.SphereGeometry(size, 8, 8);
      const mat = new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff2e7d,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5
      );
      mesh.userData = {
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        vz: (Math.random() - 0.5) * 0.15,
        life: 1,
        decay: 0.002 + Math.random() * 0.005
      };
      scene.add(mesh);
      loveParticles.push(mesh);
    }
  }

  function updateLoveParticles() {
    for (let i = loveParticles.length - 1; i >= 0; i--) {
      const p = loveParticles[i];
      p.position.x += p.userData.vx;
      p.position.y += p.userData.vy;
      p.position.z += p.userData.vz;
      p.userData.life -= p.userData.decay;
      p.material.opacity = p.userData.life;
      p.scale.setScalar(p.userData.life * 0.8 + 0.2);
      if (p.userData.life <= 0) {
        scene.remove(p);
        loveParticles.splice(i, 1);
      }
    }
  }

  function loveExplosion() {
    createLoveExplosion();
    light1.intensity = 3;
    setTimeout(() => { light1.intensity = 1.2; }, 300);
  }

  // ========== HUJAN LOVE ==========
  let rainParticles = [];
  let rainActive = false;

  function createRainLove() {
    // Hapus hujan lama
    rainParticles.forEach(p => scene.remove(p));
    rainParticles = [];

    const count = 200;
    const colors = [0xff2e7d, 0xff6b9d, 0xff1493, 0xff69b4];
    
    for (let i = 0; i < count; i++) {
      const size = 0.03 + Math.random() * 0.08;
      const geo = new THREE.SphereGeometry(size, 6, 6);
      const mat = new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff2e7d,
        emissiveIntensity: 0.3,
        transparent: true,
        opacity: 0.8
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 12,
        Math.random() * 8 - 2,
        (Math.random() - 0.5) * 8
      );
      mesh.userData = {
        speed: 0.01 + Math.random() * 0.03,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.02
      };
      scene.add(mesh);
      rainParticles.push(mesh);
    }
    rainActive = true;
  }

  function updateRain() {
    if (!rainActive) return;
    for (const p of rainParticles) {
      p.position.y -= p.userData.speed;
      p.userData.wobble += p.userData.wobbleSpeed;
      p.position.x += Math.sin(p.userData.wobble) * 0.002;
      // Reset ke atas kalo udah jatuh
      if (p.position.y < -4) {
        p.position.y = 5 + Math.random() * 2;
        p.position.x = (Math.random() - 0.5) * 12;
        p.position.z = (Math.random() - 0.5) * 8;
      }
    }
  }

  function toggleHujanLove() {
    if (rainActive) {
      rainActive = false;
      rainParticles.forEach(p => scene.remove(p));
      rainParticles = [];
    } else {
      createRainLove();
    }
  }

  // ========== KEMBANG API ==========
  let fireworks = [];

  function createFirework() {
    const count = 150;
    const colors = [0xff2e7d, 0xff6b9d, 0xff1493, 0xff69b4, 0xffaa00, 0x00ffaa, 0xaa00ff];
    const baseX = (Math.random() - 0.5) * 8;
    const baseY = 1 + Math.random() * 3;
    const baseZ = (Math.random() - 0.5) * 5;

    for (let i = 0; i < count; i++) {
      const size = 0.04 + Math.random() * 0.1;
      const geo = new THREE.SphereGeometry(size, 6, 6);
      const mat = new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff2e7d,
        emissiveIntensity: 0.6,
        transparent: true,
        opacity: 1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(baseX, baseY, baseZ);
      
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 2;
      const speed = 0.05 + Math.random() * 0.1;
      
      mesh.userData = {
        vx: Math.sin(theta) * Math.cos(phi) * speed,
        vy: Math.sin(phi) * speed,
        vz: Math.cos(theta) * Math.cos(phi) * speed,
        life: 1,
        decay: 0.005 + Math.random() * 0.01
      };
      scene.add(mesh);
      fireworks.push(mesh);
    }
  }

  function updateFireworks() {
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const p = fireworks[i];
      p.position.x += p.userData.vx;
      p.position.y += p.userData.vy;
      p.position.z += p.userData.vz;
      p.userData.vy -= 0.002; // gravitasi
      p.userData.life -= p.userData.decay;
      p.material.opacity = p.userData.life;
      p.scale.setScalar(p.userData.life * 0.6 + 0.4);
      if (p.userData.life <= 0) {
        scene.remove(p);
        fireworks.splice(i, 1);
      }
    }
  }

  function fireworks() {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => createFirework(), i * 400);
    }
    // Efek lampu
    light1.intensity = 4;
    setTimeout(() => { light1.intensity = 1.2; }, 500);
  }

  // ========== FUNGSI WARNA ==========
  function gantiWarna(warna) {
    let color, emissive;
    switch(warna) {
      case 'merah': color = 0xff2e7d; emissive = 0x550011; break;
      case 'biru': color = 0x2e7dff; emissive = 0x001155; break;
      case 'hijau': color = 0x2eff7d; emissive = 0x005511; break;
      default: color = 0xff2e7d; emissive = 0x550011;
    }
    heartGroup.children.forEach(child => {
      if (child.isMesh) {
        child.material.color.setHex(color);
        child.material.emissive.setHex(emissive);
      }
    });
    light1.color.setHex(color);
  }

  // ========== FUNGSI LAGU ==========
  let audioCtx = null;
  let isPlaying = false;
  let timerId = null;
  let currentMelody = [];

  const melodies = {
    sedih: [523, 523, 523, 587, 784, 784, 784, 659, 587, 523],
    ceria: [523, 587, 659, 784, 880, 784, 659, 587, 523, 587, 659, 784],
    random: () => Array.from({length: 12}, () => Math.floor(Math.random() * 400) + 400)
  };

  function stopMusik() {
    if (timerId) { clearTimeout(timerId); timerId = null; }
    if (audioCtx) audioCtx.suspend();
    isPlaying = false;
  }

  function gantiLagu(tipe) {
    stopMusik();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (tipe === 'random') currentMelody = melodies.random();
    else currentMelody = melodies[tipe] || melodies.sedih;
    
    audioCtx.resume();
    isPlaying = true;
    
    let index = 0;
    function playNext() {
      if (!isPlaying || index >= currentMelody.length) {
        index = 0;
        if (isPlaying) timerId = setTimeout(playNext, 300);
        return;
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = currentMelody[index];
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
      
      index++;
      timerId = setTimeout(playNext, 350 + Math.random() * 100);
    }
    playNext();
  }

  // ========== ANIMASI ==========
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.02;

    // Denyut jantung
    const scale = 1 + Math.sin(time * 2.5) * 0.05;
    heartGroup.scale.set(scale, scale, scale);
    heartGroup.rotation.y = Math.sin(time * 0.2) * 0.5;
    heartGroup.rotation.x = Math.sin(time * 0.15) * 0.1;
    heartGroup.rotation.z = Math.sin(time * 0.1) * 0.05;

    // Bintang berputar
    stars.rotation.y += 0.0005;
    stars.rotation.x += 0.0002;

    // Update semua partikel
    updateLoveParticles();
    updateRain();
    updateFireworks();

    renderer.render(scene, camera);
  }
  animate();

  // ========== RESIZE ==========
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ========== AUTO START ==========
  window.addEventListener('load', () => {
    setTimeout(() => gantiLagu('sedih'), 500);
    setTimeout(() => loveExplosion(), 1000);
    setTimeout(() => createRainLove(), 2000);
    setTimeout(() => fireworks(), 3000);
    setTimeout(() => fireworks(), 4000);
  });
</script>
</body>
  </html>
